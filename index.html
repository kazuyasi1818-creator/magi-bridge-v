<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>MAGI Bridge v4.2 Auto</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}
body{max-width:900px;margin:0 auto;padding:24px;background:#111;color:#eee}
h1{margin-bottom:4px}.muted{color:#aaa}.good{color:#9fe3a7}.warn{color:#e4c878}.bad{color:#ff9a9a}
textarea,select,button,input{font:inherit}
textarea{width:100%;min-height:140px;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #444;background:#1b1b1b;color:#fff}
.row{display:flex;gap:12px;align-items:center;margin:12px 0;flex-wrap:wrap}
button{padding:10px 18px;border:0;border-radius:10px;cursor:pointer;font-weight:700}
button:disabled{opacity:.55;cursor:not-allowed}
.card,.box{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:16px;margin:14px 0;white-space:pre-wrap;line-height:1.55}
.speaker{font-weight:800;margin-bottom:8px}.error{color:#ff9a9a}.progress{font-weight:700}
.cost{background:#171717;border:1px solid #3b3b3b;border-radius:12px;padding:14px 16px;margin:14px 0}
.costMain{font-size:1.15rem;font-weight:850}.costSub{margin-top:5px;color:#bbb;font-size:.92rem;line-height:1.45}.stepCost{margin-top:10px;color:#aaa;font-size:.85rem}
.fileInput{width:100%;box-sizing:border-box;padding:11px;border:1px solid #444;border-radius:10px;background:#1b1b1b;color:#fff}.fileList{margin-top:8px;color:#bbb;font-size:.88rem;line-height:1.5;white-space:pre-wrap}
.tag{display:inline-block;padding:3px 8px;border-radius:999px;background:#2b2b2b;margin-right:6px;font-size:.82rem}.summary{font-size:.95rem}.history{font-size:.87rem;color:#bbb;white-space:pre-wrap}
</style>
</head>
<body>
<h1>MAGI Bridge v4.2</h1>
<div class="muted">開始1回 → GPT提案 → Claude監査 → GPT改訂 → Claude判定 → 軽微REVISEは自動再改訂。人間が必要な時だけ停止。</div>

<div class="cost">
  <div class="costMain" id="costMain">今回のAPI概算：¥0.00（$0.0000）</div>
  <div class="costSub" id="costSub">OpenAI $0.0000 / Claude $0.0000 ・ 為替は1ドル=160円で概算</div>
  <div class="stepCost" id="tokenInfo">まだ実行していません</div>
</div>

<h3>研究テーマ</h3>
<textarea id="topic">競馬MAGI：T009R収益性FAILの原因分解を継続する。数値・証拠・ガバナンスを優先し、原因候補を過大主張せず監査する。</textarea>

<h3>証拠</h3>
<div class="box">
  <input class="fileInput" id="evidenceFiles" type="file" multiple accept=".json,.csv,.txt,.md,application/json,text/csv,text/plain,text/markdown" />
  <div class="fileList" id="evidenceInfo">未選択</div>
  <div class="row">
    <label><input type="checkbox" id="cacheEvidence" checked> この端末に証拠を保存して次回自動再利用</label>
    <label><input type="checkbox" id="reuseCached" checked> 保存済み証拠を使う</label>
    <button id="clearEvidence" type="button">保存済み証拠を消す</button>
  </div>
  <div class="warn">保存先はこのブラウザ内だけ。APIキー等の秘密情報は入れないでください。JSON / CSV / TXT / MD、最大5ファイル・合計80,000文字。</div>
</div>

<div class="row">
  <label>自動再改訂上限 <select id="maxAuto"><option value="0">0</option><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option></select></label>
  <label>API上限 ¥ <input id="yenCap" type="number" value="50" min="5" step="5" style="width:80px;padding:8px;border-radius:8px;border:1px solid #444;background:#1b1b1b;color:#fff"></label>
  <label>円換算 <input id="fx" type="number" inputmode="decimal" value="160" min="1" step="0.1" style="width:82px;padding:8px;border-radius:8px;border:1px solid #444;background:#1b1b1b;color:#fff"> 円/$</label>
</div>
<div class="row">
  <button id="run">研究を開始</button>
  <button id="share" disabled>結果を共有</button>
  <span id="status" class="muted"></span>
</div>

<div id="runSummary"></div>
<div id="result"></div>

<h3>この端末の履歴</h3>
<div class="box history" id="historyInfo">履歴なし</div>

<script>
const $=id=>document.getElementById(id);
const run=$('run'),share=$('share'),result=$('result'),status=$('status'),runSummary=$('runSummary');
const costMain=$('costMain'),costSub=$('costSub'),tokenInfo=$('tokenInfo'),fxEl=$('fx');
const evidenceFilesEl=$('evidenceFiles'),evidenceInfo=$('evidenceInfo');
const MAX_FILES=5,MAX_TOTAL_CHARS=80000,MAX_FILE_CHARS=60000;
const KEY_EVIDENCE='magi_v42_evidence_cache_v1',KEY_RUNS='magi_v42_runs_v1',KEY_TOPIC='magi_v42_topic_v1';
const AUTO_FIXABLE=new Set(['REPORTING_OR_INFERENCE','EVIDENCE_RECONCILIATION']);
let cost={openai:0,anthropic:0,totalTokens:0,steps:0,unknown:false};
let latestRecord=null;

function fmtUsd(n,d=4){return '$'+Number(n||0).toFixed(d)}
function currentFx(){const n=Number(fxEl.value);return Number.isFinite(n)&&n>0?n:160}
function spentYen(){return (cost.openai+cost.anthropic)*currentFx()}
function capYen(){const n=Number($('yenCap').value);return Number.isFinite(n)&&n>0?n:50}
function refreshCost(){
 const total=cost.openai+cost.anthropic, yen=total*currentFx();
 costMain.textContent=`今回のAPI概算：¥${yen.toFixed(2)}（${fmtUsd(total,4)}）`;
 costSub.textContent=`OpenAI ${fmtUsd(cost.openai,4)} / Claude ${fmtUsd(cost.anthropic,4)} ・ 為替は1ドル=${currentFx().toFixed(1)}円で概算`;
 tokenInfo.textContent=`API呼び出し ${cost.steps}回 ・ 合計 ${cost.totalTokens.toLocaleString()} tokens${cost.unknown?' ・ 未登録モデル料金は合計外':''}`;
}
fxEl.addEventListener('input',refreshCost);
function resetCost(){cost={openai:0,anthropic:0,totalTokens:0,steps:0,unknown:false};refreshCost()}
function addUsage(u){
 if(!u)return;cost.steps++;cost.totalTokens+=Number(u.total_tokens||0);
 if(u.usd==null){cost.unknown=true;refreshCost();return}
 if(u.provider==='openai')cost.openai+=Number(u.usd||0);
 if(u.provider==='anthropic')cost.anthropic+=Number(u.usd||0);
 refreshCost();
}
function card(speaker,text,usage,evidence,structured){
 const c=document.createElement('div');c.className='card';
 const s=document.createElement('div');s.className='speaker';s.textContent=speaker;c.appendChild(s);
 if(structured){
  const tag=document.createElement('span');tag.className='tag';tag.textContent=structured.reported_verdict||'UNKNOWN';c.appendChild(tag);
  const tag2=document.createElement('span');tag2.className='tag';tag2.textContent=structured.revision_class||'UNKNOWN';c.appendChild(tag2);
 }
 const t=document.createElement('div');t.textContent=text;c.appendChild(t);
 if(evidence?.length){const e=document.createElement('div');e.className='stepCost';e.textContent='証拠: '+evidence.map(x=>`${x.name} [${String(x.sha256||'').slice(0,12)}…]`).join(' / ');c.appendChild(e)}
 if(usage){const x=document.createElement('div');x.className='stepCost';const yen=usage.usd==null?'?':(usage.usd*currentFx()).toFixed(2);x.textContent=`この呼び出し: ${usage.total_tokens||0} tokens / ${usage.usd==null?'料金未登録':fmtUsd(usage.usd,5)+' ≈ ¥'+yen}`;c.appendChild(x)}
 result.appendChild(c)
}
async function sha256(text){const data=new TextEncoder().encode(text);const hash=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,'0')).join('')}
function allowedFile(file){const name=file.name.toLowerCase();return ['.json','.csv','.txt','.md'].some(ext=>name.endsWith(ext))}
function loadCachedEvidence(){try{return JSON.parse(localStorage.getItem(KEY_EVIDENCE)||'[]')}catch{return []}}
function saveCachedEvidence(ev){try{localStorage.setItem(KEY_EVIDENCE,JSON.stringify(ev));return true}catch{return false}}
function showEvidenceState(){
 const files=[...evidenceFilesEl.files],cached=loadCachedEvidence();
 if(files.length){evidenceInfo.textContent=`新規 ${files.length}ファイルを選択中\n`+files.map(f=>`・${f.name} (${(f.size/1024).toFixed(1)} KB)`).join('\n');return}
 if($('reuseCached').checked&&cached.length){evidenceInfo.innerHTML=`<span class="good">保存済み証拠 ${cached.length}件を自動再利用</span>\n`+cached.map(e=>`・${e.name} [${String(e.client_sha256||e.sha256||'').slice(0,16)}…]`).join('\n');return}
 evidenceInfo.textContent='未選択';
}
evidenceFilesEl.addEventListener('change',showEvidenceState);$('reuseCached').addEventListener('change',showEvidenceState);
$('clearEvidence').onclick=()=>{localStorage.removeItem(KEY_EVIDENCE);evidenceFilesEl.value='';showEvidenceState()};
async function prepareEvidence(){
 const files=[...evidenceFilesEl.files];
 if(!files.length&&$('reuseCached').checked){return loadCachedEvidence()}
 if(files.length>MAX_FILES)throw new Error(`証拠ファイルは最大${MAX_FILES}個です`);
 const out=[];let total=0;
 for(const file of files){
  if(!allowedFile(file))throw new Error(`未対応形式です: ${file.name}`);
  const content=await file.text();
  if(content.length>MAX_FILE_CHARS)throw new Error(`${file.name} が大きすぎます（最大${MAX_FILE_CHARS.toLocaleString()}文字）`);
  total+=content.length;if(total>MAX_TOTAL_CHARS)throw new Error(`証拠ファイル合計が${MAX_TOTAL_CHARS.toLocaleString()}文字を超えています`);
  out.push({name:file.name,type:file.type||'text/plain',size:file.size,content,client_sha256:await sha256(content)});
 }
 if(out.length&&$('cacheEvidence').checked){const ok=saveCachedEvidence(out);if(!ok)throw new Error('端末内の証拠保存に失敗しました。ブラウザ容量を確認してください。')}
 return out;
}
async function step(payload){
 if(spentYen()>=capYen())throw new Error(`API上限 ¥${capYen().toFixed(0)} に到達したため自動停止しました`);
 const r=await fetch('/api/step',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});
 const raw=await r.text();let d;try{d=JSON.parse(raw)}catch{throw new Error(`サーバー応答を読めませんでした (${r.status}): ${raw.slice(0,300)}`)}
 if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d
}
function verdictFrom(d){
 if(d?.structured?.reported_verdict)return d.structured;
 const m=String(d?.text||'').match(/\b(PASS|REVISE|REJECT)\b/i);
 return {reported_verdict:m?m[1].toUpperCase():'UNKNOWN',revision_class:'SCIENTIFIC_UNRESOLVED',human_action_required:true,next_action:'MANUAL_REVIEW',confirmed_facts:[],unresolved:['Structured verdict unavailable'],required_machine_tests:[]}
}
function makeRunId(){return `MAGI-${new Date().toISOString().replace(/[-:.TZ]/g,'').slice(0,14)}-${crypto.getRandomValues(new Uint32Array(1))[0].toString(16).slice(0,6)}`}
function loadRuns(){try{return JSON.parse(localStorage.getItem(KEY_RUNS)||'[]')}catch{return []}}
function saveRun(r){const arr=loadRuns();arr.unshift(r);while(arr.length>12)arr.pop();try{localStorage.setItem(KEY_RUNS,JSON.stringify(arr))}catch{while(arr.length>4)arr.pop();localStorage.setItem(KEY_RUNS,JSON.stringify(arr))}renderHistory()}
function renderHistory(){const arr=loadRuns();if(!arr.length){$('historyInfo').textContent='履歴なし';return}$('historyInfo').textContent=arr.slice(0,5).map(r=>`${r.completed_at}  ${r.run_id}\n  ${r.final_verdict} / ${r.stop_reason} / ¥${Number(r.cost_yen||0).toFixed(2)}`).join('\n\n')}
function compactText(s,n=6000){s=String(s||'');return s.length<=n?s:s.slice(0,n)+'\n...[truncated]'}
function buildHandoff(r){
 return [
  'MAGI Bridge v4.2 HANDOFF',
  `run_id: ${r.run_id}`,
  `bridge_version: ${r.bridge_version}`,
  `completed_at: ${r.completed_at}`,
  `topic: ${r.topic}`,
  `final_verdict: ${r.final_verdict}`,
  `revision_class: ${r.verdict?.revision_class||''}`,
  `human_action_required: ${Boolean(r.verdict?.human_action_required)}`,
  `stop_reason: ${r.stop_reason}`,
  `auto_revisions: ${r.auto_revisions}`,
  `cost_yen_estimate: ${Number(r.cost_yen||0).toFixed(2)}`,
  'evidence:',...(r.evidence||[]).map(e=>`- ${e.name} sha256=${e.sha256||e.client_sha256||''}`),
  'next_action:',r.verdict?.next_action||'',
  'confirmed_facts:',...(r.verdict?.confirmed_facts||[]).map(x=>`- ${x}`),
  'unresolved:',...(r.verdict?.unresolved||[]).map(x=>`- ${x}`),
  'required_machine_tests:',...(r.verdict?.required_machine_tests||[]).map(x=>`- ${x}`),
  'last_gpt_report:',compactText(r.last_gpt,5000)
 ].join('\n')
}
async function shareLatest(){
 if(!latestRecord)return;
 const text=buildHandoff(latestRecord);
 try{
  if(navigator.share){await navigator.share({title:`MAGI ${latestRecord.run_id}`,text});status.textContent='共有しました';return}
  await navigator.clipboard.writeText(text);status.textContent='共有用テキストをコピーしました';
 }catch(e){if(e?.name!=='AbortError')status.textContent='共有をキャンセル/失敗'}
}
share.onclick=shareLatest;
function showSummary(r){
 const cls=r.final_verdict==='PASS'?'good':(r.final_verdict==='REJECT'?'bad':'warn');
 runSummary.innerHTML=`<div class="box summary"><b>Run ${r.run_id}</b><br><span class="${cls}"><b>${r.final_verdict}</b></span> / ${r.stop_reason}<br>自動再改訂 ${r.auto_revisions}回 ・ 概算 ¥${Number(r.cost_yen).toFixed(2)}<br>${r.verdict?.human_action_required?'人間/外部解析が必要':'この証拠内で処理完了'}</div>`;
}

run.onclick=async()=>{
 run.disabled=true;share.disabled=true;result.innerHTML='';runSummary.innerHTML='';resetCost();
 const topic=$('topic').value.trim();localStorage.setItem(KEY_TOPIC,topic);
 const maxAuto=Number($('maxAuto').value);const transcript=[];let evidence=[];let lastGpt='';let finalVerdict=null;let stopReason='UNKNOWN';let autoRevisions=0;const runId=makeRunId();const startedAt=new Date().toISOString();
 try{
  status.textContent='証拠を準備中…';evidence=await prepareEvidence();showEvidenceState();
  status.textContent='GPT提案中…';let g=await step({stage:'gpt_initial',topic,evidence});addUsage(g.usage);card(`${g.speaker} [${g.model}]`,g.text,g.usage,g.evidence);transcript.push({stage:g.stage,speaker:g.speaker,text:g.text,usage:g.usage});lastGpt=g.text;
  status.textContent='Claude一次監査中…';let a=await step({stage:'claude_audit',topic,previous:g.text,evidence});addUsage(a.usage);card(`${a.speaker} [${a.model}]`,a.text,a.usage,a.evidence);transcript.push({stage:a.stage,speaker:a.speaker,text:a.text,usage:a.usage});
  status.textContent='GPT改訂中…';g=await step({stage:'gpt_revise',topic,previous:g.text,audit:a.text,evidence});addUsage(g.usage);card(`${g.speaker} [${g.model}]`,g.text,g.usage,g.evidence);transcript.push({stage:g.stage,speaker:g.speaker,text:g.text,usage:g.usage});lastGpt=g.text;

  for(;;){
   status.textContent='Claude最終判定中…';const v=await step({stage:'claude_verdict',topic,previous:g.text,evidence});addUsage(v.usage);finalVerdict=verdictFrom(v);card(`${v.speaker} [${v.model}]`,v.text,v.usage,v.evidence,finalVerdict);transcript.push({stage:v.stage,speaker:v.speaker,text:v.text,structured:finalVerdict,usage:v.usage});
   const verdict=finalVerdict.reported_verdict;
   if(verdict==='PASS'){stopReason='PASS';break}
   if(verdict==='REJECT'){stopReason='REJECT_HUMAN_REVIEW';break}
   const canAuto=verdict==='REVISE'&&!finalVerdict.human_action_required&&AUTO_FIXABLE.has(finalVerdict.revision_class)&&autoRevisions<maxAuto;
   if(!canAuto){
    if(verdict==='REVISE'&&autoRevisions>=maxAuto)stopReason='AUTO_REVISION_LIMIT';
    else if(verdict==='REVISE')stopReason=`HUMAN_OR_MACHINE_ACTION:${finalVerdict.revision_class||'UNKNOWN'}`;
    else stopReason='UNKNOWN_VERDICT';
    break;
   }
   autoRevisions++;
   status.textContent=`軽微REVISEを自動修正 ${autoRevisions}/${maxAuto}…`;
   g=await step({stage:'gpt_revise',topic,previous:g.text,audit:v.text,evidence});addUsage(g.usage);card(`${g.speaker} / 自動再改訂 ${autoRevisions} [${g.model}]`,g.text,g.usage,g.evidence);transcript.push({stage:'gpt_auto_revise',speaker:g.speaker,text:g.text,usage:g.usage});lastGpt=g.text;
  }
  status.textContent='完了';
 }catch(e){stopReason=String(e?.message||e);status.textContent='自動停止';card('停止理由',stopReason)}finally{
  const evMeta=(transcript.find(x=>x.stage==='gpt_initial')?evidence:[]).map(e=>({name:e.name,sha256:e.client_sha256||e.sha256||'',chars:String(e.content||'').length,size:e.size||0}));
  const rec={run_id:runId,bridge_version:'4.2-auto-v1',started_at:startedAt,completed_at:new Date().toISOString(),topic,evidence:evMeta,transcript,final_verdict:finalVerdict?.reported_verdict||'STOPPED',verdict:finalVerdict,stop_reason:stopReason,auto_revisions:autoRevisions,cost_yen:spentYen(),cost_usd:cost.openai+cost.anthropic,total_tokens:cost.totalTokens,last_gpt:lastGpt};
  latestRecord=rec;saveRun(rec);showSummary(rec);share.disabled=false;run.disabled=false;
 }
}

const savedTopic=localStorage.getItem(KEY_TOPIC);if(savedTopic)$('topic').value=savedTopic;
showEvidenceState();renderHistory();resetCost();
</script>
</body>
</html>
