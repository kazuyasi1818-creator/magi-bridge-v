<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>MAGI Bridge v4</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}
body{max-width:900px;margin:0 auto;padding:24px;background:#111;color:#eee}
h1{margin-bottom:4px}.muted{color:#aaa}textarea,select,button{font:inherit}
textarea{width:100%;min-height:150px;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #444;background:#1b1b1b;color:#fff}
.row{display:flex;gap:12px;align-items:center;margin:12px 0;flex-wrap:wrap}
button{padding:10px 18px;border:0;border-radius:10px;cursor:pointer;font-weight:700}
.card{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:16px;margin:14px 0;white-space:pre-wrap;line-height:1.55}
.speaker{font-weight:800;margin-bottom:8px}.error{color:#ff9a9a}.progress{font-weight:700}
.cost{background:#171717;border:1px solid #3b3b3b;border-radius:12px;padding:14px 16px;margin:14px 0}
.costMain{font-size:1.15rem;font-weight:850}.costSub{margin-top:5px;color:#bbb;font-size:.92rem;line-height:1.45}
.stepCost{margin-top:10px;color:#aaa;font-size:.85rem}
</style>
</head>
<body>
<h1>MAGI Bridge v4</h1>
<div class="muted">GPT提案 → Claude監査 → GPT改訂 → Claude最終判定（最終判定を短く安定化・実使用トークンから料金を概算）</div>

<div class="cost">
  <div class="costMain" id="costMain">今回のAPI概算：¥0.00（$0.0000）</div>
  <div class="costSub" id="costSub">OpenAI $0.0000 / Claude $0.0000 ・ 為替は1ドル=160円で概算</div>
  <div class="stepCost" id="tokenInfo">まだ実行していません</div>
</div>

<h3>研究テーマ</h3>
<textarea id="topic">競馬MAGI：回収率100%超を目標に、過学習を避けながら買うレースを絞る検証設計を作る。</textarea>
<div class="row">
<label>往復回数 <select id="rounds"><option value="1" selected>1</option><option value="2">2</option><option value="3">3</option></select></label>
<label>円換算 <input id="fx" type="number" inputmode="decimal" value="160" min="1" step="0.1" style="width:82px;padding:8px;border-radius:8px;border:1px solid #444;background:#1b1b1b;color:#fff"> 円/$</label>
<button id="run">対話を開始</button><span id="status" class="muted"></span>
</div>
<div id="result"></div>
<script>
const run=document.getElementById('run'),result=document.getElementById('result'),status=document.getElementById('status');
const costMain=document.getElementById('costMain'),costSub=document.getElementById('costSub'),tokenInfo=document.getElementById('tokenInfo'),fxEl=document.getElementById('fx');
let cost={openai:0,anthropic:0,totalTokens:0,steps:0,unknown:false};
function fmtUsd(n,d=4){return '$'+Number(n||0).toFixed(d)}
function currentFx(){const n=Number(fxEl.value);return Number.isFinite(n)&&n>0?n:160}
function refreshCost(){
 const total=cost.openai+cost.anthropic, yen=total*currentFx();
 costMain.textContent=`今回のAPI概算：¥${yen.toFixed(2)}（${fmtUsd(total,4)}）`;
 costSub.textContent=`OpenAI ${fmtUsd(cost.openai,4)} / Claude ${fmtUsd(cost.anthropic,4)} ・ 為替は1ドル=${currentFx().toFixed(1)}円で概算`;
 tokenInfo.textContent=`API呼び出し ${cost.steps}回 ・ 合計 ${cost.totalTokens.toLocaleString()} tokens${cost.unknown?' ・ 未登録モデルの料金は合計に含まず':''}`;
}
fxEl.addEventListener('input',refreshCost);
function resetCost(){cost={openai:0,anthropic:0,totalTokens:0,steps:0,unknown:false};refreshCost()}
function addUsage(u){
 if(!u)return;
 cost.steps++;
 cost.totalTokens+=Number(u.total_tokens||0);
 if(u.usd==null){cost.unknown=true;refreshCost();return}
 if(u.provider==='openai')cost.openai+=Number(u.usd||0);
 if(u.provider==='anthropic')cost.anthropic+=Number(u.usd||0);
 refreshCost();
}
function card(speaker,text,usage){
 const c=document.createElement('div');c.className='card';
 const s=document.createElement('div');s.className='speaker';s.textContent=speaker;
 const t=document.createElement('div');t.textContent=text;c.append(s,t);
 if(usage){const x=document.createElement('div');x.className='stepCost';const yen=usage.usd==null?'?':(usage.usd*currentFx()).toFixed(2);x.textContent=`この呼び出し: ${usage.total_tokens||0} tokens / ${usage.usd==null?'料金未登録':fmtUsd(usage.usd,5)+' ≈ ¥'+yen}`;c.appendChild(x)}
 result.appendChild(c)
}
async function step(payload){
 const r=await fetch('/api/step',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});
 const raw=await r.text();let d;try{d=JSON.parse(raw)}catch{throw new Error(`サーバー応答を読めませんでした (${r.status}): ${raw.slice(0,300)}`)}
 if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d
}
run.onclick=async()=>{
 run.disabled=true;result.innerHTML='';resetCost();
 const topic=document.getElementById('topic').value;const rounds=Number(document.getElementById('rounds').value);
 try{
  status.textContent='1/4 GPTが提案中…';let g=await step({stage:'gpt_initial',topic});addUsage(g.usage);card(`${g.speaker} [${g.model}]`,g.text,g.usage);
  for(let i=1;i<=rounds;i++){
   status.textContent=`Claude監査 ${i}/${rounds}…`;let a=await step({stage:'claude_audit',topic,previous:g.text});addUsage(a.usage);card(`${a.speaker} ${i} [${a.model}]`,a.text,a.usage);
   status.textContent=`GPT改訂 ${i}/${rounds}…`;g=await step({stage:'gpt_revise',topic,previous:g.text,audit:a.text});addUsage(g.usage);card(`${g.speaker} ${i} [${g.model}]`,g.text,g.usage);
  }
  status.textContent='最終判定中…';let v=await step({stage:'claude_verdict',topic,previous:g.text});addUsage(v.usage);card(`${v.speaker} [${v.model}]`,v.text,v.usage);status.textContent='完了';
 }catch(e){status.textContent='エラー';const msg=e?.message||String(e);card('エラー',msg + (msg.includes('Load failed')?'\n\n最終通信が長引いた可能性があります。v4では最終判定を短くして安定化しています。再実行するとAPI料金が追加で発生する可能性があります。':''))}finally{run.disabled=false}
}
resetCost();
</script>
</body>
</html>
