name: MAGI structured verdict E2E

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for production deployment
        run: sleep 30

      - name: Test REJECT case against production Vercel and Claude
        env:
          BASE_URL: https://magi-bridge-v4.vercel.app
        run: |
          set -euo pipefail
          cat > /tmp/reject.json <<'JSON'
          {
            "stage": "claude_verdict",
            "topic": "MAGI Bridge v4.4 最終E2Eテスト。架空ケース: OOS 60レースでROI 105%、リークなし、控除率込み。ただし期間安定性と買い目耐性は未検証。さらにOOS結果を確認した後に閾値を調整したところROI 120%になった。この結果だけで本番採用PASSへ昇格してよいか。",
            "previous": "最終提案: OOS確認後の閾値調整でROIが120%まで改善したため、この120%を根拠に本番採用PASSへ昇格してよい。期間安定性と買い目耐性は未検証だが、ROI改善を優先して採用する。"
          }
          JSON
          code=$(curl -sS -o /tmp/reject.out -w '%{http_code}' -H 'content-type: application/json' --data-binary @/tmp/reject.json "$BASE_URL/api/step")
          echo "HTTP=$code"
          cat /tmp/reject.out
          test "$code" = "200"
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/reject.out'))
          s=d.get('structured') or {}
          assert s.get('reported_verdict') == 'REJECT', s
          assert s.get('parse_error') is False, s
          assert 'Structured verdict parse failed' not in json.dumps(d, ensure_ascii=False), d
          print('REJECT_E2E=PASS')
          print('bridge_version='+str(d.get('bridge_version')))
          print('model='+str(d.get('model')))
          PY

      - name: Test PASS case against production Vercel and Claude
        env:
          BASE_URL: https://magi-bridge-v4.vercel.app
        run: |
          set -euo pipefail
          cat > /tmp/pass.json <<'JSON'
          {
            "stage": "claude_verdict",
            "topic": "2+2=4だけ監査",
            "previous": "標準自然数の算術において2+2=4である。本案は追加修正不要で確定可能。"
          }
          JSON
          code=$(curl -sS -o /tmp/pass.out -w '%{http_code}' -H 'content-type: application/json' --data-binary @/tmp/pass.json "$BASE_URL/api/step")
          echo "HTTP=$code"
          cat /tmp/pass.out
          test "$code" = "200"
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/pass.out'))
          s=d.get('structured') or {}
          assert s.get('reported_verdict') == 'PASS', s
          assert s.get('revision_class') == 'NONE', s
          assert s.get('human_action_required') is False, s
          assert s.get('parse_error') is False, s
          assert 'Structured verdict parse failed' not in json.dumps(d, ensure_ascii=False), d
          print('PASS_E2E=PASS')
          print('bridge_version='+str(d.get('bridge_version')))
          print('model='+str(d.get('model')))
          PY
