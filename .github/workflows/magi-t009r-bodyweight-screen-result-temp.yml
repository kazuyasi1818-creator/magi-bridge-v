name: TEMP T009R Bodyweight Screen Result Audit

on:
  pull_request:
    branches: [main]

jobs:
  bridge-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Audit frozen screen result via production MAGI Bridge
        env:
          BASE_URL: https://magi-bridge-v4.vercel.app
          PACKET_B64: 
        run: |
          python3 - <<'PY'
          import base64,json,os,urllib.request,urllib.error,sys
          BASE=os.environ['BASE_URL'].rstrip('/')
          packet=base64.b64decode(os.environ['PACKET_B64']).decode()
          topic='競馬MAGI T009R bodyweight adjacent screen 結果監査。prereg後に固定条件のまま計算した結果がNO_SCREEN_SUPPORT。signed bodyweight changeはsecondaryで有意だが、これを事後的にprimaryへ昇格させない。2026 outcome禁止、T011はT009R代用禁止、Gate/feature/strategy変更禁止。計算・binary判定・解釈境界を監査する。'
          ev=[{'name':'T009R_bodyweight_adjacent_screen_bridge_audit_packet_v1.json','content':packet,'size':len(packet)}]
          spent=0.;fx=160.;cap=50.
          def post(stage,previous='',audit=''):
            global spent
            body={'stage':stage,'topic':topic,'evidence':ev,'budget_remaining_yen':max(0,cap-spent*fx),'budget_fx_yen_per_usd':fx}
            if previous: body['previous']=previous
            if audit: body['audit']=audit
            req=urllib.request.Request(BASE+'/api/step',data=json.dumps(body,ensure_ascii=False).encode(),headers={'content-type':'application/json'},method='POST')
            try:
              with urllib.request.urlopen(req,timeout=120) as r: raw=r.read().decode();code=r.status
            except urllib.error.HTTPError as e: raw=e.read().decode();code=e.code
            print('\n=== '+stage+' HTTP '+str(code)+' ===');print(raw)
            if code!=200: sys.exit(2)
            d=json.loads(raw);u=d.get('usage') or {};spent+=float(u.get('usd') or 0);print('CUM_YEN=%.2f'%(spent*fx));return d
          g1=post('gpt_initial');a1=post('claude_audit',previous=g1['text']);g2=post('gpt_revise',previous=g1['text'],audit=a1['text']);v=post('claude_verdict',previous=g2['text']);s=v.get('structured') or {}
          print('\nFINAL_STRUCTURED='+json.dumps(s,ensure_ascii=False));print('TOTAL_YEN=%.2f'%(spent*fx))
          if s.get('parse_error') is not False: sys.exit(3)
          PY
