name: Keiba realtime provenance pipeline E2E

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keiba-realtime-pipeline-e2e.yml'
      - 'scripts/keiba_build_snapshot_provenance_v1.py'
      - 'scripts/keiba_snapshot_gate_check_v2.py'

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build synthetic capture and run full Gate pipeline
        run: |
          set -euo pipefail
          rm -rf /tmp/keiba_rt_e2e
          mkdir -p /tmp/keiba_rt_e2e/RAW_APPEND_ONLY/20260829 /tmp/keiba_rt_e2e/out
          printf 'WH synthetic realtime bytes' > /tmp/keiba_rt_e2e/RAW_APPEND_ONLY/20260829/wh.jvraw
          printf 'WE synthetic realtime bytes' > /tmp/keiba_rt_e2e/RAW_APPEND_ONLY/20260829/we.jvraw

          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('/tmp/keiba_rt_e2e/RAW_APPEND_ONLY/20260829')
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          wh=root/'wh.jvraw'; we=root/'we.jvraw'
          wh_meta={
            'capture_id':'CAP_WH','dataspec':'0B11','request_key':'20260829',
            'source_capture_time_jst':'2026-08-29T09:00:10+09:00','source_capture_time_utc':'2026-08-29T00:00:10+00:00',
            'raw_file':str(wh),'raw_file_sha256':sha(wh),'record_count':1,'open_code':0,'read_error':None,
            'records':[{'record_sequence':1,'record_id':'WH','supported_parser':True,'race_id':'2026082901010101',
              'source_announcement_time_jst':'2026-08-29T09:00:00+09:00','horses':[{'horse_no':'01','body_weight_kg':480,'body_weight_change_kg':10}]}]
          }
          we_meta={
            'capture_id':'CAP_WE','dataspec':'0B14','request_key':'20260829',
            'source_capture_time_jst':'2026-08-29T08:30:10+09:00','source_capture_time_utc':'2026-08-28T23:30:10+00:00',
            'raw_file':str(we),'raw_file_sha256':sha(we),'record_count':1,'open_code':0,'read_error':None,
            'records':[{'record_sequence':1,'record_id':'WE','supported_parser':True,'scope_key':'20260829010101',
              'source_announcement_time_jst':'2026-08-29T08:30:00+09:00','weather_code':'1','track_turf_code':'2','track_dirt_code':'3'}]
          }
          (root/'CAP_WH.json').write_text(json.dumps(wh_meta,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'CAP_WE.json').write_text(json.dumps(we_meta,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

          cat > /tmp/keiba_rt_e2e/plan.csv <<'CSV'
          race_id,horse_no,snapshot_role,prediction_snapshot_time_jst
          2026082901010101,1,EARLY,2026-08-29T10:00:00+09:00
          CSV

          python3 -m py_compile scripts/keiba_build_snapshot_provenance_v1.py scripts/keiba_snapshot_gate_check_v2.py
          python3 scripts/keiba_build_snapshot_provenance_v1.py \
            --root /tmp/keiba_rt_e2e \
            --snapshot-plan /tmp/keiba_rt_e2e/plan.csv \
            --out-csv /tmp/keiba_rt_e2e/out/provenance.csv \
            --out-source-manifest /tmp/keiba_rt_e2e/out/source_manifest.json \
            > /tmp/keiba_rt_e2e/out/builder_summary.json

          python3 scripts/keiba_snapshot_gate_check_v2.py \
            /tmp/keiba_rt_e2e/out/provenance.csv \
            --source-manifest /tmp/keiba_rt_e2e/out/source_manifest.json \
            --out /tmp/keiba_rt_e2e/out/gate_result.json

          python3 - <<'PY'
          import csv,hashlib,json,os
          from pathlib import Path
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          prov=Path('/tmp/keiba_rt_e2e/out/provenance.csv')
          rows=list(csv.DictReader(prov.open(encoding='utf-8')))
          gate=json.loads(Path('/tmp/keiba_rt_e2e/out/gate_result.json').read_text(encoding='utf-8'))
          features=sorted(r['feature_name'] for r in rows)
          expected=['body_weight_change_kg','body_weight_kg','weather']
          ok=(gate['status']=='PASS' and gate['violation_count']==0 and features==expected)
          out={
            'test_id':'KEIBA_REALTIME_PROVENANCE_PIPELINE_E2E_V1',
            'commit_sha_under_test':os.environ.get('GITHUB_SHA'),
            'builder_sha256':sha('scripts/keiba_build_snapshot_provenance_v1.py'),
            'checker_sha256':sha('scripts/keiba_snapshot_gate_check_v2.py'),
            'provenance_row_count':len(rows),
            'features':features,
            'expected_features':expected,
            'gate_status':gate['status'],
            'gate_violation_count':gate['violation_count'],
            'source_files_verified':gate['verified_source_file_count'],
            'status':'PASS' if ok else 'FAIL',
            'validation_oos_opened':False,
            'meaning':'Synthetic E2E only; real Windows/JV-Link forward capture remains required.'
          }
          Path('.magi/keiba_realtime_provenance_pipeline_e2e_v1.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          if not ok: raise SystemExit(2)
          PY

      - name: Commit E2E evidence
        run: |
          git config user.name 'magi-pipeline-bot'
          git config user.email 'magi-pipeline-bot@users.noreply.github.com'
          git add .magi/keiba_realtime_provenance_pipeline_e2e_v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Freeze realtime provenance pipeline E2E evidence'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
