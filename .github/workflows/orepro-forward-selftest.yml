name: OrePro Forward Pipeline Selftest

on:
  push:
    paths:
      - 'scripts/orepro_*.py'
      - 'tests/orepro_forward_selftest_v1.py'
      - '.github/workflows/orepro-forward-selftest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run synthetic forward-pipeline test
        run: |
          python3 tests/orepro_forward_selftest_v1.py | tee /tmp/orepro_forward_proof.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/orepro_forward_proof.json',encoding='utf-8'))
          assert p['status']=='PASS'
          assert all(p['checks'].values())
          print('OREPRO_FORWARD_SELFTEST_PASS')
          PY
      - name: Hash implementation under test
        run: |
          sha256sum scripts/orepro_freeze_prediction_v1.py scripts/orepro_entry_sheet_v1.py scripts/orepro_weekly_report_v1.py tests/orepro_forward_selftest_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: orepro-forward-proof
          path: /tmp/orepro_forward_proof.json
