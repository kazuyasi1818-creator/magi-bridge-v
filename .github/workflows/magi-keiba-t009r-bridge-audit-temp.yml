name: TEMP MAGI KEIBA T009R Bridge Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  bridge-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run T009R audit through production MAGI Bridge
        env:
          BASE_URL: https://magi-bridge-v4.vercel.app
          EVIDENCE_B64: 
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request, urllib.error, sys
          BASE=os.environ['BASE_URL'].rstrip('/')
          evidence=base64.b64decode(os.environ['EVIDENCE_B64']).decode('utf-8')
          topic='競馬MAGI T009R root-cause audit v2.2。現在の数値証拠で改訂済みmechanism主張の強さが妥当か、Gate昇格禁止が守られているか、将来confirmatory反証条件が十分固定されているかだけを監査する。2026 sealed outcomeは禁止。戦略・閾値・feature・Gateを変更しない。'
          spent_usd=0.0; fx=160.0; cap_yen=50.0
          ev=[{'name':'T009R_bridge_audit_packet_v1.json','content':evidence,'size':len(evidence)}]
          def post(stage, previous='', audit=''):
              global spent_usd
              remain=max(0.0,cap_yen-spent_usd*fx)
              body={'stage':stage,'topic':topic,'evidence':ev,'budget_remaining_yen':remain,'budget_fx_yen_per_usd':fx}
              if previous: body['previous']=previous
              if audit: body['audit']=audit
              req=urllib.request.Request(BASE+'/api/step', data=json.dumps(body,ensure_ascii=False).encode(), headers={'content-type':'application/json'}, method='POST')
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      raw=r.read().decode(); code=r.status
              except urllib.error.HTTPError as e:
                  raw=e.read().decode(); code=e.code
              print('\n=== '+stage+' HTTP '+str(code)+' ===')
              print(raw)
              if code != 200: sys.exit(2)
              d=json.loads(raw); u=d.get('usage') or {}; spent_usd += float(u.get('usd') or 0)
              print('CUMULATIVE_YEN=%.2f REMAINING_YEN=%.2f' % (spent_usd*fx, max(0,cap_yen-spent_usd*fx)))
              return d
          g1=post('gpt_initial')
          a1=post('claude_audit', previous=g1['text'])
          g2=post('gpt_revise', previous=g1['text'], audit=a1['text'])
          v=post('claude_verdict', previous=g2['text'])
          s=v.get('structured') or {}
          print('\nFINAL_STRUCTURED='+json.dumps(s,ensure_ascii=False))
          print('FINAL_VERDICT='+str(s.get('reported_verdict')))
          print('FINAL_REVISION_CLASS='+str(s.get('revision_class')))
          print('FINAL_HUMAN_ACTION='+str(s.get('human_action_required')))
          print('FINAL_PARSE_ERROR='+str(s.get('parse_error')))
          print('TOTAL_YEN=%.2f' % (spent_usd*fx))
          if s.get('parse_error') is not False: sys.exit(3)
          PY
