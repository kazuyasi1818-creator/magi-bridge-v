name: temp-bridge-checkerc-v2-audit
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  bridge-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run production MAGI Bridge audit
        run: node .magi/temp_bridge_audit/run_bridge_audit.mjs
      - name: Upload Bridge result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checker-c-v2-bridge-result
          path: bridge_result.json
          if-no-files-found: error
          retention-days: 7
