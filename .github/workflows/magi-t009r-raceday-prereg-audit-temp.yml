name: TEMP T009R Race-day Proxy Prereg Audit

on:
  pull_request:
    branches: [main]

jobs:
  bridge-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Audit prereg via production MAGI Bridge
        env:
          BASE_URL: https://magi-bridge-v4.vercel.app
          P1_B64: 
          P2_B64: 
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request, urllib.error, sys
          BASE=os.environ['BASE_URL'].rstrip('/')
          p1=base64.b64decode(os.environ['P1_B64']).decode('utf-8')
          p2=base64.b64decode(os.environ['P2_B64']).decode('utf-8')
          topic='競馬MAGI T009R race-day proxy prereg監査。2025H2はretrospective diagnosticのみ。2026 outcome禁止。現在馬体重proxyがT009R-vs-market disagreementを説明する可能性を検証する設計を、結果を見る前に固定できているか監査する。Gate/strategy/threshold/feature adoptionは禁止。'
          ev=[
            {'name':'T009R_raceday_proxy_prereg_candidate_v1.json','content':p1,'size':len(p1)},
            {'name':'T009R_bridge_audit_packet_v1_2_compact.json','content':p2,'size':len(p2)}
          ]
          spent=0.0; fx=160.0; cap=50.0
          def post(stage, previous='', audit=''):
              global spent
              body={'stage':stage,'topic':topic,'evidence':ev,'budget_remaining_yen':max(0,cap-spent*fx),'budget_fx_yen_per_usd':fx}
              if previous: body['previous']=previous
              if audit: body['audit']=audit
              req=urllib.request.Request(BASE+'/api/step',data=json.dumps(body,ensure_ascii=False).encode(),headers={'content-type':'application/json'},method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=120) as r:
                      raw=r.read().decode(); code=r.status
              except urllib.error.HTTPError as e:
                  raw=e.read().decode(); code=e.code
              print('\n=== '+stage+' HTTP '+str(code)+' ===')
              print(raw)
              if code!=200: sys.exit(2)
              d=json.loads(raw); u=d.get('usage') or {}; spent += float(u.get('usd') or 0)
              print('CUM_YEN=%.2f' % (spent*fx))
              return d
          g1=post('gpt_initial')
          a1=post('claude_audit',previous=g1['text'])
          g2=post('gpt_revise',previous=g1['text'],audit=a1['text'])
          v=post('claude_verdict',previous=g2['text'])
          s=v.get('structured') or {}
          print('\nFINAL_STRUCTURED='+json.dumps(s,ensure_ascii=False))
          print('FINAL_VERDICT='+str(s.get('reported_verdict')))
          print('FINAL_REVISION_CLASS='+str(s.get('revision_class')))
          print('FINAL_HUMAN_ACTION='+str(s.get('human_action_required')))
          print('FINAL_PARSE_ERROR='+str(s.get('parse_error')))
          print('TOTAL_YEN=%.2f' % (spent*fx))
          if s.get('parse_error') is not False: sys.exit(3)
          PY
