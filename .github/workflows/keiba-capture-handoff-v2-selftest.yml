name: keiba-capture-handoff-v2-selftest

on:
  push:
    paths:
      - 'scripts/keiba_verify_first_capture_v2.py'
      - 'scripts/keiba_make_capture_handoff_v2.py'
      - 'scripts/keiba_jvlink_first_capture_v2.ps1'
      - 'tests/keiba_verify_first_capture_v2_selftest.py'
      - 'tests/keiba_capture_handoff_v2_selftest.py'
      - '.github/workflows/keiba-capture-handoff-v2-selftest.yml'
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run current-run verifier selftest
        run: python tests/keiba_verify_first_capture_v2_selftest.py | tee /tmp/keiba_verify_first_capture_v2_selftest.json
      - name: Run redacted handoff selftest
        run: python tests/keiba_capture_handoff_v2_selftest.py | tee /tmp/keiba_capture_handoff_v2_selftest.json
      - name: Assert both PASS
        run: |
          grep -q '"status": "PASS"' /tmp/keiba_verify_first_capture_v2_selftest.json
          grep -q '"status": "PASS"' /tmp/keiba_capture_handoff_v2_selftest.json
      - name: Upload selftest evidence
        uses: actions/upload-artifact@v4
        with:
          name: keiba-capture-gate-v5-selftests
          path: |
            /tmp/keiba_verify_first_capture_v2_selftest.json
            /tmp/keiba_capture_handoff_v2_selftest.json
