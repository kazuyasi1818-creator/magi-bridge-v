name: Keiba Snapshot Gate v3 semantic E2E

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keiba-snapshot-gate-v3-e2e.yml'
      - '.magi/keiba_pre_race_snapshot_contract_v3.json'
      - 'scripts/keiba_snapshot_gate_check_v3.py'
      - 'scripts/keiba_build_snapshot_provenance_v2.py'
      - 'scripts/keiba_jvlink_realtime_capture_v2.py'

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test official semantics and latest-complete-0B14 state
        run: |
          set -euo pipefail
          rm -rf /tmp/kv3
          mkdir -p /tmp/kv3/RAW_APPEND_ONLY/20260829 /tmp/kv3/out
          printf 'WH latest bytes' > /tmp/kv3/RAW_APPEND_ONLY/20260829/wh.jvraw
          printf 'B14 old bytes' > /tmp/kv3/RAW_APPEND_ONLY/20260829/b14_old.jvraw
          printf 'B14 latest bytes' > /tmp/kv3/RAW_APPEND_ONLY/20260829/b14_latest.jvraw

          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=Path('/tmp/kv3/RAW_APPEND_ONLY/20260829')
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          wh=d/'wh.jvraw'; old=d/'b14_old.jvraw'; latest=d/'b14_latest.jvraw'
          common={'race_id':'2026082901010101'}
          (d/'WH.json').write_text(json.dumps({
            'capture_id':'WH1','dataspec':'0B11','source_capture_time_jst':'2026-08-29T08:40:10+09:00','source_capture_time_utc':'2026-08-28T23:40:10+00:00',
            'raw_file':str(wh),'raw_file_sha256':sha(wh),'record_count':1,'open_code':0,'read_error':None,
            'records':[{'record_sequence':1,'record_id':'WH','race_id':common['race_id'],'source_announcement_time_jst':'2026-08-29T08:40:00+09:00','horses':[{'horse_no':'01','body_weight_kg':480,'body_weight_change_kg':0}]}]
          },ensure_ascii=False),encoding='utf-8')
          # Older complete 0B14 capture contains a scratch event.
          (d/'B14_OLD.json').write_text(json.dumps({
            'capture_id':'B14_OLD','dataspec':'0B14','source_capture_time_jst':'2026-08-29T08:20:10+09:00','source_capture_time_utc':'2026-08-28T23:20:10+00:00',
            'raw_file':str(old),'raw_file_sha256':sha(old),'record_count':1,'open_code':0,'read_error':None,
            'records':[{'record_sequence':1,'record_id':'AV','race_id':common['race_id'],'horse_no':'01','scratch_exclusion_code':'1','source_announcement_time_jst':'2026-08-29T08:20:00+09:00'}]
          },ensure_ascii=False),encoding='utf-8')
          # Latest complete 0B14 capture no longer contains AV: event was withdrawn.
          (d/'B14_LATEST.json').write_text(json.dumps({
            'capture_id':'B14_LATEST','dataspec':'0B14','source_capture_time_jst':'2026-08-29T08:50:10+09:00','source_capture_time_utc':'2026-08-28T23:50:10+00:00',
            'raw_file':str(latest),'raw_file_sha256':sha(latest),'record_count':1,'open_code':0,'read_error':None,
            'records':[{'record_sequence':1,'record_id':'WE','scope_key':'20260829010101','source_announcement_time_jst':'2026-08-29T08:50:00+09:00','current_weather_code':'1','current_track_condition_turf':'2','current_track_condition_dirt':'3'}]
          },ensure_ascii=False),encoding='utf-8')
          PY

          cat > /tmp/kv3/plan.csv <<'CSV'
          race_id,horse_no,snapshot_role,prediction_snapshot_time_jst
          2026082901010101,1,EARLY,2026-08-29T09:00:00+09:00
          CSV

          python3 -m py_compile scripts/keiba_snapshot_gate_check_v3.py scripts/keiba_build_snapshot_provenance_v2.py scripts/keiba_jvlink_realtime_capture_v2.py
          python3 scripts/keiba_build_snapshot_provenance_v2.py --root /tmp/kv3 --snapshot-plan /tmp/kv3/plan.csv --out-csv /tmp/kv3/out/provenance.csv --out-source-manifest /tmp/kv3/out/source_manifest.json > /tmp/kv3/out/builder.json
          python3 scripts/keiba_snapshot_gate_check_v3.py /tmp/kv3/out/provenance.csv --source-manifest /tmp/kv3/out/source_manifest.json --out /tmp/kv3/out/gate.json > /tmp/kv3/out/gate_stdout.json

          python3 - <<'PY'
          import csv,json,hashlib,os
          from pathlib import Path
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          rows=list(csv.DictReader(Path('/tmp/kv3/out/provenance.csv').open(encoding='utf-8')))
          features=sorted(r['feature_name'] for r in rows)
          expected=sorted(['body_weight_kg','body_weight_change_kg','weather','track_condition_turf','track_condition_dirt'])
          gate=json.loads(Path('/tmp/kv3/out/gate.json').read_text(encoding='utf-8'))
          no_withdrawn=('scratch_exclusion_code' not in features)
          zero_change=any(r['feature_name']=='body_weight_change_kg' and r['feature_value']=='0' for r in rows)
          ok=(features==expected and no_withdrawn and zero_change and gate['status']=='PASS' and gate['violation_count']==0 and gate['checker_id']=='KEIBA_SNAPSHOT_GATE_CHECK_V3')
          out={
            'test_id':'KEIBA_SNAPSHOT_GATE_V3_SEMANTIC_E2E_V1',
            'commit_sha_under_test':os.environ.get('GITHUB_SHA'),
            'contract_sha256':sha('.magi/keiba_pre_race_snapshot_contract_v3.json'),
            'collector_v2_sha256':sha('scripts/keiba_jvlink_realtime_capture_v2.py'),
            'builder_v2_sha256':sha('scripts/keiba_build_snapshot_provenance_v2.py'),
            'checker_v3_sha256':sha('scripts/keiba_snapshot_gate_check_v3.py'),
            'features':features,'expected_features':expected,
            'withdrawn_old_av_not_carried_forward':no_withdrawn,
            'wh_000_semantics_zero_change_proven':zero_change,
            'gate_status':gate['status'],'gate_violation_count':gate['violation_count'],
            'status':'PASS' if ok else 'FAIL','validation_oos_opened':False
          }
          Path('.magi/keiba_snapshot_gate_v3_semantic_e2e_v1.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          if not ok: raise SystemExit(2)
          PY

      - name: Commit semantic E2E evidence
        run: |
          git config user.name 'magi-gate-v3-bot'
          git config user.email 'magi-gate-v3-bot@users.noreply.github.com'
          git add .magi/keiba_snapshot_gate_v3_semantic_e2e_v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Freeze snapshot Gate v3 semantic E2E evidence'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
