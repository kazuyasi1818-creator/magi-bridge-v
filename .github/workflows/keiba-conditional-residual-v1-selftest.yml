name: keiba-conditional-residual-v1-selftest

on:
  push:
    paths:
      - 'scripts/keiba_conditional_market_residual_objective_v1.py'
      - 'scripts/keiba_conditional_market_residual_aggregate_v2.py'
      - 'scripts/keiba_conditional_market_residual_trainer_v1.py'
      - 'scripts/keiba_residual_train_preprocess_v1.py'
      - 'scripts/keiba_residual_history_availability_gate_v1.py'
      - 'tests/keiba_conditional_market_residual_objective_v1_selftest.py'
      - 'tests/keiba_conditional_market_residual_aggregate_v2_selftest.py'
      - 'tests/keiba_conditional_market_residual_trainer_v1_selftest.py'
      - 'tests/keiba_residual_history_availability_gate_v1_selftest.py'
      - '.github/workflows/keiba-conditional-residual-v1-selftest.yml'
  workflow_dispatch:

jobs:
  synthetic-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numeric dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Run objective gradient test
        run: python tests/keiba_conditional_market_residual_objective_v1_selftest.py | tee /tmp/objective.json
      - name: Run fixed-prior aggregate test
        run: python tests/keiba_conditional_market_residual_aggregate_v2_selftest.py | tee /tmp/aggregate.json
      - name: Run trainer reproducibility test
        run: python tests/keiba_conditional_market_residual_trainer_v1_selftest.py | tee /tmp/trainer.json
      - name: Run history availability test
        run: python tests/keiba_residual_history_availability_gate_v1_selftest.py | tee /tmp/history.json
      - name: Assert all PASS
        run: |
          grep -q '"status": "PASS"' /tmp/objective.json
          grep -q '"status": "PASS"' /tmp/aggregate.json
          grep -q '"status": "PASS"' /tmp/trainer.json
          grep -q '"status": "PASS"' /tmp/history.json
      - name: Upload synthetic evidence
        uses: actions/upload-artifact@v4
        with:
          name: keiba-conditional-residual-v1-selftest
          path: |
            /tmp/objective.json
            /tmp/aggregate.json
            /tmp/trainer.json
            /tmp/history.json
